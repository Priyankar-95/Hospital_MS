<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My appointments - Liberty Health Care</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/shared/tailwind.css">
</head>
<body>
  <div id="app-header"></div>
  <main id="app-main">
    <section class="mx-auto max-w-4xl px-4 py-8 sm:px-6">
      <h1 class="font-display text-headline-lg-mobile sm:text-headline-lg">My appointments</h1>
      <p class="mt-1 text-body-md text-on-surface-variant">Your bookings, with a PDF invoice for each.</p>
      <div class="seg-tabs mt-6 grid-cols-2 sm:max-w-sm" role="tablist" aria-label="Upcoming or past">
        <button type="button" role="tab" data-scope="upcoming" class="seg-tab" aria-selected="true"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">event_upcoming</span>Upcoming</button>
        <button type="button" role="tab" data-scope="past" class="seg-tab" aria-selected="false"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">history</span>Past</button>
      </div>
      <div id="list" class="mt-6 space-y-4" aria-live="polite" aria-busy="true"></div>
      <nav id="pager" class="mt-6 flex items-center justify-center gap-3" aria-label="Pages" hidden></nav>
    </section>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="/frontend/patient/appointments.js"></script>
</body>
</html>
